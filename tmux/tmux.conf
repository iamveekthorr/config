# =============================================================================
# General
# =============================================================================

set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# No delay after escape (critical for neovim)
set -sg escape-time 0
set -g focus-events on

set -g history-limit 50000
set -g mouse on
setw -g mode-keys vi
set -g set-titles on
set -g set-titles-string "#S / #W"

# =============================================================================
# Terminal / color
# =============================================================================

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"

# Pass through OSC sequences so ghostty shell-integration keeps working
# (semantic prompt zones, cursor shapes, marks, etc.)
set -g allow-passthrough on

# =============================================================================
# Key bindings
# =============================================================================

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# Splits that open in the current pane's directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Smart-splits.nvim tmux integration — mirrors the C-h/j/k/l mappings in
# smart-splits.lua. The @pane-is-vim flag is set/unset by smart-splits via
# autocmd, so nvim and plain terminal panes are handled without any heuristic.
bind -n C-h if -F "#{@pane-is-vim}" "send-keys C-h" "select-pane -L"
bind -n C-j if -F "#{@pane-is-vim}" "send-keys C-j" "select-pane -D"
bind -n C-k if -F "#{@pane-is-vim}" "send-keys C-k" "select-pane -U"
bind -n C-l if -F "#{@pane-is-vim}" "send-keys C-l" "select-pane -R"

# Same in copy mode
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# Pane resize (mirrors <localleader>h/j/k/l in smart-splits.lua)
bind -n M-h if -F "#{@pane-is-vim}" "send-keys M-h" "resize-pane -L 3"
bind -n M-j if -F "#{@pane-is-vim}" "send-keys M-j" "resize-pane -D 3"
bind -n M-k if -F "#{@pane-is-vim}" "send-keys M-k" "resize-pane -U 3"
bind -n M-l if -F "#{@pane-is-vim}" "send-keys M-l" "resize-pane -R 3"

# =============================================================================
# Status bar
# =============================================================================

set -g status-position top

# =============================================================================
# Plugins
# =============================================================================

set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "catppuccin/tmux#v2.1.3"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"

# Catppuccin — Mocha to match ghostty theme
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_status_background "default"

set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session} #{E:@catppuccin_status_directory}"
set -g status-right-length 100

# Resurrect / Continuum
set -g @continuum-restore "on"
set -g @resurrect-capture-pane-contents "on"
set -g @resurrect-strategy-nvim "session"

# Initialize TPM — must stay at the very bottom
run "~/.config/tmux/plugins/tpm/tpm"
