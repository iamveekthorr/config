"$schema" = 'https://starship.rs/config-schema.json'

# Keep everything on one line
add_newline = false

# Dynamic prompt format that adapts to git repos
format = """
$username$hostname-> $directory$git_branch$git_status$git_metrics\
$nodejs$python$golang$rust$java$cmd_duration
$character
"""

[username]
style_user = 'green bold'
style_root = 'red bold'
format = '[$user]($style)'
disabled = false
show_always = true
aliases = { "victorokonkwo" = "devthorr" }

[hostname]
ssh_only = false
ssh_symbol = "🕸️ "
format = '[$ssh_symbol](bold blue)[@$hostname](bold red) '
trim_at = '.'
disabled = false
aliases =  { "Victors-MacBook-Pro" = "home", "Victors-MBP" = "home" }


# ===== Directory =====
[directory]
format = "[📁 $path]($style) "
style = "bold cyan"
truncation_length = 3
truncate_to_repo = true

# ===== Git Branch =====
[git_branch]
format = "[on](dim white) [$symbol$branch]($style) "
symbol = " "
style = "bold purple"
only_attached = false

[git_status]
format = "[|](dim white) [$all_status$ahead_behind]($style) "
style = "bold yellow"
conflicted = "⚔️ "
ahead = "🏎️ ×${count} "
behind = "🐌×${count} "
diverged = "🔱 🏎️ ×${ahead_count} 🐌×${behind_count} "
up_to_date = "✅ "
untracked = "🆕×${count} "
stashed = "📦 "
modified = "📝×${count} "
staged = "🗃️ ×${count} "
renamed = "📛×${count} "
deleted = "🗑️ ×${count} "
disabled = true

[git_metrics]
format = "([|](dim white) [+$added]($added_style) )([-$deleted]($deleted_style) )"
added_style = "bold green"
deleted_style = "bold red"
only_nonzero_diffs = true
disabled = true

# ===== Languages =====
[nodejs]
format = "[using](dim white) [$symbol$version]($style) "
symbol = "⬢  "
style = "bold green"

[python]
format = "[using](dim white) [$symbol$version]($style) "
symbol = "  "
style = "bold blue"

[golang]
format = "[using](dim white) [$symbol$version]($style) "
symbol = " "
style = "bold cyan"

[rust]
format = "[using](dim white) [$symbol$version]($style) "
symbol = "🦀 "
style = "bold red"

[java]
format = "[using](dim white) [$symbol$version]($style) "
symbol = " "
style = "bold cyan"

[lua]
format = "[using](dim white) [$symbol$version]($style) "
symbol = " "
style = "bold cyan"

# ===== Command Duration =====
[cmd_duration]
format = "[for](dim white) [⏱ $duration]($style) "
style = "bold yellow"
min_time = 500
show_milliseconds = true

# ===== Prompt Symbol =====
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[package]
disabled = true
