[window]
#decorations = "none"
startup_mode = "Maximized"
opacity = 0.85
padding = { x = 2, y = 0 }
dynamic_padding = true
#blur = true

# macOS-specific
option_as_alt = "Both"

[font]
size = 12.0
builtin_box_drawing = true

# Maple Mono NF: same font with Nerd Font glyphs for icon support
# Mirrors Ghostty: font-style = Italic (default text renders in italic)
[font.normal]
family = "Maple Mono NF"
style = "Italic"

[font.bold]
family = "Maple Mono NF"
style = "Bold Italic"

[font.italic]
family = "Maple Mono NF"
style = "Italic"

[font.bold_italic]
family = "Maple Mono NF"
style = "Bold Italic"

[cursor]
style = { shape = "Beam", blinking = "Always" }
vi_mode_style = { shape = "Block", blinking = "Never" }
blink_interval = 500
blink_timeout = 0
unfocused_hollow = true

[colors]
# Catppuccin Mocha theme
primary = { background = "#1e1e2e", foreground = "#cdd6f4" }
cursor = { text = "#1e1e2e", cursor = "#4a9eff" }
selection = { text = "#00d4ff", background = "#264f78" }

# Normal colors
normal = { black = "#45475a", red = "#f38ba8", green = "#a6e3a1", yellow = "#f9e2af", blue = "#89b4fa", magenta = "#f5c2e7", cyan = "#94e2d5", white = "#bac2de" }

# Bright colors
bright = { black = "#585b70", red = "#f38ba8", green = "#a6e3a1", yellow = "#f9e2af", blue = "#89b4fa", magenta = "#f5c2e7", cyan = "#94e2d5", white = "#a6adc8" }

[mouse]
hide_when_typing = true

[keyboard]
bindings = [
  { key = "Return", mods = "Command", action = "None" }
]

[env]
TERM = "xterm-256color"
COLORTERM = "truecolor"
